name: Nosh Bio
description: >-
  Nosh.bio is a Berlin-based sustainable food-technology company founded in 2022 by Tim Fronzek and
  Felipe Lino that produces nutritional, highly functional proteins from non-GMO fungi via proprietary
  precision fermentation. Its flagship Koji Protein and Koji-Beef mince hybrid are mycelium-derived,
  clean-label mycoprotein ingredients with binding, gelling and texturizing properties, sold B2B to
  manufacturers across meat alternatives, seafood, dairy, sauces, confectionery, wellness and pet food.
  The company is a foodtech portfolio company of Earlybird Venture Capital and closed a EUR 3.2M seed
  round. This is a company profile in the API Evangelist network; Nosh.bio publishes no developer API,
  SDK, developer portal, or technical integration surface at this time.
